name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  lint-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx --yes license-checker --production --failOn 'GPL;AGPL;LGPL'

  integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        keycloak: ['25.0', '26.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: KEYCLOAK_VERSION=${{ matrix.keycloak }} docker compose up -d
      - name: Wait for Keycloak
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/realms/demo/.well-known/openid-configuration && exit 0
            sleep 3
          done
          docker compose logs; exit 1
      - run: npm run test:integration

  package:
    runs-on: ubuntu-latest
    needs: lint-unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with: { name: vsix, path: '*.vsix' }
